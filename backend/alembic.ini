# ==============================================================================
# Alembic Configuration File
# ==============================================================================
# This file is consumed by `alembic` CLI commands.
# The actual DATABASE_URL is loaded from the .env file via env.py — the value
# below is a placeholder and will be overridden at runtime.
# ==============================================================================

[alembic]
# Path to the migration scripts folder (relative to this file)
script_location = alembic

# Template for auto-generated migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone used in the generated file names
timezone = UTC

# Prepend sys.path with this location when running migrations
# (empty = alembic already finds app/ via the working directory)
prepend_sys_path = .

# SQLAlchemy URL — overridden in env.py from settings; keep as placeholder
sqlalchemy.url = postgresql+psycopg2://postgres:password@localhost:5432/vehicle_management

# ---------------------------------------------------------------------------
# Logging configuration
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
